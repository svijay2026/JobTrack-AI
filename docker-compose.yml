version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jobtrack_db
    restart: always
    environment:
      POSTGRES_USER: jobtrack_user
      POSTGRES_PASSWORD: jobtrack_password
      POSTGRES_DB: jobtrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobtrack_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://jobtrack_user:jobtrack_password@db:5432/jobtrack_db
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_change_in_production_12345}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtrack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
