version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: jobtrack_mysql_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: jobtrack_ai
      MYSQL_USER: jobtrack_user
      MYSQL_PASSWORD: jobtrack_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobtrack_backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: jobtrack_user
      DB_PASSWORD: jobtrack_password
      DB_NAME: jobtrack_ai
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://jobtrack_user:jobtrack_password@db:3306/jobtrack_ai?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_change_in_production_12345}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtrack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
